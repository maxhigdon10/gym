<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Checklist</title>

<style>
:root {
  --bg: #0f172a;
  --card: #020617;
  --accent: #38bdf8;
  --muted: #94a3b8;
  --text: #e5e7eb;
  --today: #22c55e;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
}

h1 {
  margin: 16px;
  font-size: 1.4rem;
}

.month {
  margin-bottom: 24px;
}

.month h2 {
  margin: 8px 16px;
  font-size: 1rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  padding: 8px 12px;
}

.day {
  background: var(--card);
  border-radius: 12px;
  padding: 8px 4px;
  text-align: center;
  font-size: 0.8rem;
  cursor: pointer;
  border: 1px solid #020617;
}

.day.done {
  border-color: var(--accent);
}

.day.today {
  outline: 2px solid var(--today);
  outline-offset: -2px;
}

.day span {
  display: block;
  margin-top: 4px;
  font-size: 0.65rem;
  color: var(--muted);
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal.open {
  display: flex;
}

.sheet {
  background: var(--card);
  width: 92%;
  max-width: 420px;
  border-radius: 20px;
  padding: 18px;
}

.sheet h3 {
  margin-top: 0;
  margin-bottom: 12px;
}

label {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 10px 0;
}

button {
  width: 100%;
  margin-top: 16px;
  padding: 12px;
  background: var(--accent);
  border: none;
  border-radius: 999px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<div id="months"></div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="modalDate"></h3>
    <div id="checklist"></div>
    <button onclick="closeModal()">Done</button>
  </div>
</div>

<script>
const checklistItems = ["Workout", "Deep work", "Read", "Sleep 8h"];
const year = new Date().getFullYear();
const todayKey = new Date().toISOString().slice(0,10);
const storageKey = "dailyChecklist";

const monthsEl = document.getElementById("months");
const titleEl = document.getElementById("title");
const modal = document.getElementById("modal");
const checklistEl = document.getElementById("checklist");
const modalDateEl = document.getElementById("modalDate");

const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");

const monthNames = [
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

titleEl.textContent = `${year} Daily Checklist`;

function openModal(dateKey) {
  modalDateEl.textContent = dateKey;
  checklistEl.innerHTML = "";

  checklistItems.forEach(item => {
    const label = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = !!saved[dateKey]?.[item];

    box.onchange = () => {
      saved[dateKey] ??= {};
      saved[dateKey][item] = box.checked;
      localStorage.setItem(storageKey, JSON.stringify(saved));
      render();
    };

    label.append(box, item);
    checklistEl.appendChild(label);
  });

  modal.classList.add("open");
}

function closeModal() {
  modal.classList.remove("open");
}

function render() {
  monthsEl.innerHTML = "";

  for (let m = 0; m < 12; m++) {
    const monthDiv = document.createElement("div");
    monthDiv.className = "month";

    const header = document.createElement("h2");
    header.textContent = monthNames[m];
    monthDiv.appendChild(header);

    const grid = document.createElement("div");
    grid.className = "calendar";

    let date = new Date(year, m, 1);
    while (date.getMonth() === m) {
      const key = date.toISOString().slice(0,10);
      const completed = Object.values(saved[key] || {}).filter(Boolean).length;

      const day = document.createElement("div");
      day.className = "day";
      if (completed === checklistItems.length) day.classList.add("done");
      if (key === todayKey) day.classList.add("today");

      day.innerHTML = `${date.getDate()}<span>${completed}/${checklistItems.length}</span>`;
      day.onclick = () => openModal(key);

      grid.appendChild(day);
