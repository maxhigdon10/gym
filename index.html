<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weekly Checklist</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    li {
      margin: 10px 0;
    }
  </style>
</head>
<body>

<h1>Weekly Goals</h1>

<ul>
  <li><input type="checkbox" data-key="task1"> Workout 3 times</li>
  <li><input type="checkbox" data-key="task2"> Ship something</li>
  <li><input type="checkbox" data-key="task3"> No skipped mornings</li>
  <li><input type="checkbox" data-key="task4"> Read 50 pages</li>
</ul>

<script>
  // Get ISO week number
  function getWeekNumber(date) {
    const temp = new Date(date.getTime());
    temp.setHours(0, 0, 0, 0);
    temp.setDate(temp.getDate() + 3 - ((temp.getDay() + 6) % 7));
    const week1 = new Date(temp.getFullYear(), 0, 4);
    return temp.getFullYear() + '-W' +
      String(
        1 + Math.round(
          ((temp - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7
        )
      ).padStart(2, '0');
  }

  const currentWeek = getWeekNumber(new Date());
  const savedWeek = localStorage.getItem('week');

  // Reset if new week
  if (savedWeek !== currentWeek) {
    localStorage.clear();
    localStorage.setItem('week', currentWeek);
  }

  document.querySelectorAll('input[type="checkbox"]').forEach(box => {
    const key = box.dataset.key;

    box.checked = localStorage.getItem(key) === 'true';

    box.addEventListener('change', () => {
      localStorage.setItem(key, box.checked);
    });
  });
</script>

</body>
</html>
