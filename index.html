<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Fitness Checklist</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
}

h1 {
  margin: 16px;
}

.month {
  margin-bottom: 24px;
}

h2 {
  margin: 8px 16px;
  font-size: 1rem;
  opacity: 0.7;
}

.grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  padding: 8px;
}

.day {
  position: relative;
  overflow: hidden;
  background: #020617;
  text-align: center;
  padding: 8px;
  border-radius: 8px;
  font-size: 0.8rem;
  cursor: pointer;
  border: 1px solid #020617;
}

/* battery fill */
.day::before {
  content: "";
  position: absolute;
  inset: 0;
  width: var(--fill, 0%);
  background: rgba(56, 189, 248, 0.25);
  z-index: 0;
}

.day.gray::before {
  background: rgba(148, 163, 184, 0.25);
}

/* content above fill */
.day > * {
  position: relative;
  z-index: 1;
}

.day.green { border-color: #22c55e; }
.day.yellow { border-color: #eab308; }
.day.gray { border-color: #64748b; }

.day.today {
  outline: 2px solid #38bdf8;
  outline-offset: -2px;
}

.day .pct {
  font-size: 0.6rem;
  opacity: 0.65;
  margin-top: 2px;
}

/* modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal.open { display: flex; }

.sheet {
  background: #020617;
  width: 92%;
  max-width: 420px;
  border-radius: 16px;
  padding: 16px;
}

label {
  display: flex;
  gap: 8px;
  padding: 8px 0;
}

input[type="number"] {
  width: 100%;
  padding: 8px;
  border-radius: 8px;
  border: none;
  margin-bottom: 12px;
}

.progress {
  height: 6px;
  background: #111827;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 6px;
}

.progress div {
  height: 100%;
  background: #22c55e;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 12px;
  border: none;
  border-radius: 999px;
  background: #38bdf8;
  cursor: pointer;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<div id="months"></div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="modalDate"></h3>

    <label>Steps today</label>
    <input type="number" id="stepInput" placeholder="e.g. 6500" />
    <div class="progress"><div id="stepBar"></div></div>
    <div id="stepPct" style="font-size:.75rem;opacity:.7;margin-bottom:10px"></div>

    <div id="checklist"></div>
    <button onclick="closeModal()">Done</button>
  </div>
</div>

<script>
var checklistItems = [
  "8000 Steps",
  "Less than 8000 Steps but played basketball",
  "Gym: Chest/Triceps",
  "Gym: Back/Biceps",
  "Gym: Legs",
  "Gym: Shoulders",
  "Rest Day"
];

var step8000 = checklistItems[0];
var stepUnder = checklistItems[1];
var gymItems = checklistItems.slice(2,6);
var restItem = checklistItems[6];

var storageKey = "dailyChecklist";
var year = new Date().getFullYear();
var todayKey = new Date().toISOString().slice(0,10);

var saved = JSON.parse(localStorage.getItem(storageKey) || "{}");

var monthsEl = document.getElementById("months");
var stepInput = document.getElementById("stepInput");
var stepBar = document.getElementById("stepBar");
var stepPct = document.getElementById("stepPct");

var monthNames = [
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

document.getElementById("title").innerText = year + " Fitness Tracker";

function getStepPct(key) {
  var steps = saved[key] && saved[key].steps;
  if (!steps) return "";
  return Math.round((steps / 8000) * 100) + "%";
}

function getDayClass(key) {
  var data = saved[key] || {};

  // Rest day always wins
  if (data[restItem]) return "gray";

  // Step flags
  var steps100 = data[step8000] === true;     // ≥ 8000
  var stepsUnder = data[stepUnder] === true; // 1–7999

  // Read raw step count for 12k rule
  var stepCount = data.steps || 0;
  var steps12000 = stepCount >= 12000;

  // Gym logic
  var gymDone = false;
  for (var j = 0; j < gymItems.length; j++) {
    if (data[gymItems[j]]) {
      gymDone = true;
      break;
    }
  }

  // ✅ NEW GREEN CONDITIONS
  if (steps12000 || (steps100 && gymDone)) {
    return "green";
  }

  // Yellow if any meaningful effort
  if (steps100 || stepsUnder || gymDone) {
    return "yellow";
  }

  return "";
}

function openModal(dateKey) {
  var list = document.getElementById("checklist");
  document.getElementById("modalDate").innerText = dateKey;
  list.innerHTML = "";

  var steps = saved[dateKey] && saved[dateKey].steps || 0;
  stepInput.value = steps || "";
  updateStepUI(steps);

  stepInput.oninput = function() {
    var val = parseInt(stepInput.value || 0, 10);
    if (!saved[dateKey]) saved[dateKey] = {};
    saved[dateKey].steps = val;

    saved[dateKey][step8000] = val >= 8000;
    saved[dateKey][stepUnder] = val > 0 && val < 8000;

    localStorage.setItem(storageKey, JSON.stringify(saved));
    updateStepUI(val);
    render();
  };

  for (var i = 2; i < checklistItems.length; i++) {
    var item = checklistItems[i];
    var label = document.createElement("label");
    var box = document.createElement("input");
    box.type = "checkbox";
    box.checked = saved[dateKey] && saved[dateKey][item];

    box.onchange = (function(dateKey, item) {
      return function(e) {
        if (!saved[dateKey]) saved[dateKey] = {};
        saved[dateKey][item] = e.target.checked;
        localStorage.setItem(storageKey, JSON.stringify(saved));
        render();
      };
    })(dateKey, item);

    label.appendChild(box);
    label.appendChild(document.createTextNode(item));
    list.appendChild(label);
  }

  document.getElementById("modal").className = "modal open";
}

function updateStepUI(steps) {
  var pct = Math.min(100, Math.round((steps / 8000) * 100));
  stepBar.style.width = pct + "%";
  stepPct.innerText = pct + "% of 8000 steps";
}

function closeModal() {
  document.getElementById("modal").className = "modal";
}

function render() {
  monthsEl.innerHTML = "";

  for (var m = 0; m < 12; m++) {
    var monthDiv = document.createElement("div");
    monthDiv.className = "month";

    var header = document.createElement("h2");
    header.innerText = monthNames[m];
    monthDiv.appendChild(header);

    var grid = document.createElement("div");
    grid.className = "grid";

    var d = new Date(year, m, 1);
    while (d.getMonth() === m) {
      var key = d.toISOString().slice(0,10);
      var pct = getStepPct(key);

      var day = document.createElement("div");
      day.className = "day " + getDayClass(key);
      day.style.setProperty("--fill", pct + "%");
      if (key === todayKey) day.className += " today";

      day.innerHTML =
        d.getDate() +
        (pct ? '<div class="pct">' + pct + '%</div>' : '');

      day.onclick = (function(key){
        return function(){ openModal(key); };
      })(key);

      grid.appendChild(day);
      d.setDate(d.getDate() + 1);
    }

    monthDiv.appendChild(grid);
    monthsEl.appendChild(monthDiv);
  }
}

render();
</script>
<div style="text-align:center; padding:24px; opacity:.7;">
  <a href="weight.html" style="color:#38bdf8; text-decoration:none;">
    → Go to Weight Tracker
  </a>
</div>
</body>
</html>
