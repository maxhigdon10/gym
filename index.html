<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Checklist</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #020617;
      --accent: #38bdf8;
      --text: #e5e7eb;
      --today: #22c55e;
      --today: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    h1 {
      margin: 16px;
    }

    .month {
      margin-bottom: 24px;
    }


    .month h2 {
      margin: 8px 16px;
      font-size: 1rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }


    .month {
      margin-bottom: 24px;
    }


    .month h2 {
      margin: 8px 16px;
      font-size: 1rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }


    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .day {
      background: var(--card);
      text-align: center;
      cursor: pointer;
      border: 1px solid #020617;
    }

    .day.done {
      border-color: var(--accent);
    }

    .day.today {
      outline: 2px solid var(--today);
      outline-offset: -2px;
    }


    .day.today {
      outline: 2px solid var(--today);
      outline-offset: -2px;
    }


    .day span {
      display: block;
      color: var(--muted);
      margin-top: 2px;
      margin-top: 2px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal.open {
      display: flex;
    }

    .sheet {
      background: var(--card);
    }

    .sheet h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }


    .sheet h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }


    label {
      display: flex;
      align-items: center;
    }

    button {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1 id="title"></h1>

  <div class="modal" id="modal">
    <div class="sheet">
      <div id="checklist"></div>
      <button onclick="closeModal()">Done</button>
    </div>
  </div>

<script>
  const checklistItems = ["8000 Steps", "Less than 8000 Steps but played basketball", "Gym: Chest/Triceps", "Gym: Back/Biceps", "Gym: Legs", "Gym: Shoulders", "Rest Day"];
  const year = new Date().getFullYear();
  const todayKey = new Date().toISOString().slice(0,10);
  const todayKey = new Date().toISOString().slice(0,10);
  const storageKey = "dailyChecklist";

  document.getElementById("title").textContent = year + " Daily Checklist";

  const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");


  function openModal(dateKey) {
    const modal = document.getElementById("modal");
    const list = document.getElementById("checklist");
    document.getElementById("modalDate").textContent = dateKey;
    list.innerHTML = "";

    checklistItems.forEach(item => {
      const value = saved[dateKey]?.[item];
      const label = document.createElement("label");
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = !!value;
      box.onchange = () => {
        saved[dateKey] = saved[dateKey] || {};
        saved[dateKey][item] = box.checked;
        localStorage.setItem(storageKey, JSON.stringify(saved));
        render();
      };

      label.appendChild(box);
      label.appendChild(document.createTextNode(item));
      list.appendChild(label);
    });

    modal.classList.add("open");
  }

  function closeModal() {
    document.getElementById("modal").classList.remove("open");
  }

  function render() {
    monthsEl.innerHTML = "";
      const monthDiv = document.createElement("div");      monthDiv.className = "month";
      const header = document.createElement("h2");    for (let month = 0; month < 12; month++) {      const monthDiv = document.createElement("div");      monthDiv.className = "month";
      const header = document.createElement("h2");
      header.textContent = monthNames[month];
      monthDiv.appendChild(header);


      const grid = document.createElement("div");
      grid.className = "calendar";


      const date = new Date(year, month, 1);
      while (date.getMonth() === month) {
        const key = date.toISOString().slice(0,10);
        const completed = saved[key]
          ? Object.values(saved[key]).filter(Boolean).length
          : 0;


        const div = document.createElement("div");
        div.className = "day";
        if (completed === checklistItems.length) div.classList.add("done");
        if (key === todayKey) div.classList.add("today");


        div.innerHTML = date.getDate() + `<span>${completed}/${checklistItems.length}</span>`;
        div.onclick = () => openModal(key);
        grid.appendChild(div);


        date.setDate(date.getDate() + 1);
      }


      monthDiv.appendChild(grid);
      monthsEl.appendChild(monthDiv);
    }
      header.textContent = monthNames[month];
      monthDiv.appendChild(header);


      const grid = document.createElement("div");
      grid.className = "calendar";


      const date = new Date(year, month, 1);
      while (date.getMonth() === month) {
        const key = date.toISOString().slice(0,10);
        const completed = saved[key]
          ? Object.values(saved[key]).filter(Boolean).length
          : 0;


        const div = document.createElement("div");
        div.className = "day";
        if (completed === checklistItems.length) div.classList.add("done");
        if (key === todayKey) div.classList.add("today");


        div.innerHTML = date.getDate() + `<span>${completed}/${checklistItems.length}</span>`;
        div.onclick = () => openModal(key);
        grid.appendChild(div);


        date.setDate(date.getDate() + 1);
      }


      monthDiv.appendChild(grid);
      monthsEl.appendChild(monthDiv);
    }
  }

  render();
</script>

</body>
