<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Checklist</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #020617;
      --accent: #38bdf8;
      --muted: #64748b;
      --text: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    h1 {
      font-size: 1.25rem;
      margin: 16px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 8px;
    }

    .day {
      background: var(--card);
      border-radius: 10px;
      padding: 6px 4px;
      text-align: center;
      font-size: 0.75rem;
      cursor: pointer;
      border: 1px solid #020617;
    }

    .day.done {
      border-color: var(--accent);
    }

    .day span {
      display: block;
      font-size: 0.6rem;
      color: var(--muted);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal.open {
      display: flex;
    }

    .sheet {
      background: var(--card);
      width: 90%;
      max-width: 400px;
      border-radius: 16px;
      padding: 16px;
    }

    label {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 0;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: var(--accent);
      border: none;
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1 id="title"></h1>
  <div class="calendar" id="calendar"></div>

  <div class="modal" id="modal">
    <div class="sheet">
      <h2 id="modalDate"></h2>
      <div id="checklist"></div>
      <button onclick="closeModal()">Done</button>
    </div>
  </div>

<script>
  const checklistItems = ["Workout", "Deep work", "Read", "Sleep 8h"];
  const year = new Date().getFullYear();
  const storageKey = "dailyChecklist";

  document.getElementById("title").textContent = year + " Daily Checklist";

  const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
  const calendar = document.getElementById("calendar");

  function daysInYear(y) {
    const d = new Date(y, 0, 1);
    const days = [];
    while (d.getFullYear() === y) {
      days.push(new Date(d));
      d.setDate(d.getDate() + 1);
    }
    return days;
  }

  function openModal(dateKey) {
    const modal = document.getElementById("modal");
    const list = document.getElementById("checklist");
    document.getElementById("modalDate").textContent = dateKey;
    list.innerHTML = "";

    checklistItems.forEach(item => {
      const id = dateKey + item;
      const value = saved[dateKey]?.[item];

      const label = document.createElement("label");
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = !!value;
      box.onchange = () => {
        saved[dateKey] = saved[dateKey] || {};
        saved[dateKey][item] = box.checked;
        localStorage.setItem(storageKey, JSON.stringify(saved));
        render();
      };

      label.appendChild(box);
      label.appendChild(document.createTextNode(item));
      list.appendChild(label);
    });

    modal.classList.add("open");
  }

  function closeModal() {
    document.getElementById("modal").classList.remove("open");
  }

  function render() {
    calendar.innerHTML = "";
    daysInYear(year).forEach(d => {
      const key = d.toISOString().slice(0,10);
      const completed = saved[key]
        ? Object.values(saved[key]).filter(Boolean).length
        : 0;

      const div = document.createElement("div");
      div.className = "day" + (completed === checklistItems.length ? " done" : "");
      div.innerHTML = d.getDate() + `<span>${completed}/${checklistItems.length}</span>`;
      div.onclick = () => openModal(key);
      calendar.appendChild(div);
    });
  }

  render();
</script>

</body>
</html>
