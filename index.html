<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Fitness Checklist</title>

<style>
/* ====== Visual Theme ====== */
:root {
  --blue1: rgba(56,189,248,0.35);
  --blue2: rgba(59,130,246,0.45);
  --gray1: rgba(148,163,184,0.25);
  --gray2: rgba(100,116,139,0.35);
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
}

h1 { margin: 16px; }
.month { margin-bottom: 24px; }
h2 { margin: 8px 16px; font-size: 1rem; opacity: .75; }

/* ====== Calendar ====== */
.grid {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 6px;
  padding: 8px;
}

.day {
  position: relative;
  overflow: hidden;
  background: #020617;
  padding: 8px;
  border-radius: 12px;
  text-align: center;
  font-size: .8rem;
  border: 1px solid #020617;
  cursor: pointer;
}

.day::before {
  content: "";
  position: absolute;
  inset: 0;
  width: var(--fill,0%);
  background: linear-gradient(90deg,var(--blue1),var(--blue2));
  transition: width .25s ease-out;
}

.day.gray::before {
  background: linear-gradient(90deg,var(--gray1),var(--gray2));
}

.day > * { position: relative; z-index: 1; }

.day.green {
  border-color: #22c55e;
  box-shadow: 0 0 0 1px rgba(34,197,94,.6),
              0 0 14px rgba(34,197,94,.25);
}
.day.yellow { border-color: #eab308; }
.day.gray { border-color: #64748b; }

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(56,189,248,.6); }
  70% { box-shadow: 0 0 0 6px rgba(56,189,248,0); }
  100% { box-shadow: 0 0 0 0 rgba(56,189,248,0); }
}

.day.today {
  outline: 2px solid #38bdf8;
  outline-offset: -2px;
  animation: pulse 1.5s ease-out 1;
}

.pct { font-size:.6rem; opacity:.7; }

/* ====== Modal ====== */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
}
.modal.open { display:flex; }

.sheet {
  background: #020617;
  width: 92%;
  max-width: 420px;
  border-radius: 16px;
  padding: 16px;
}

label { display:flex; gap:8px; padding:8px 0; }

input[type=number], textarea {
  width:100%;
  border-radius:8px;
  border:none;
  padding:8px;
}

.progress {
  height:6px;
  background:#111827;
  border-radius:4px;
  overflow:hidden;
}

.progress div {
  height:100%;
  background:#22c55e;
}

.bulk {
  margin-top: 14px;
  border-top: 1px solid #1e293b;
  padding-top: 12px;
}

button {
  width:100%;
  margin-top:12px;
  padding:10px;
  border:none;
  border-radius:999px;
  background:#38bdf8;
  cursor:pointer;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<div id="months"></div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="modalDate"></h3>

    <label>Steps today</label>
    <input type="number" id="stepInput" />
    <div class="progress"><div id="stepBar"></div></div>
    <div id="stepPct" style="font-size:.75rem;opacity:.7;"></div>

    <div id="checklist"></div>

    <div class="bulk">
      <strong style="font-size:.8rem">Bulk step paste</strong>
      <textarea id="bulkInput"
        placeholder="2026-04-01, 12345&#10;2026-04-02, 8450"></textarea>
      <button onclick="applyBulkSteps()">Apply Entries</button>
    </div>

    <button onclick="closeModal()">Done</button>
  </div>
</div>

<script>
/* ====== Data ====== */
var checklistItems = [
  "8000 Steps",
  "Less than 8000 Steps but played basketball",
  "Gym: Chest/Triceps",
  "Gym: Back/Biceps",
  "Gym: Legs",
  "Gym: Shoulders",
  "Rest Day"
];

var step8000 = checklistItems[0];
var stepUnder = checklistItems[1];
var gymItems = checklistItems.slice(2,6);
var restItem = checklistItems[6];

var storageKey = "dailyChecklist";
var saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
var year = new Date().getFullYear();
var todayKey = new Date().toISOString().slice(0,10);
var monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

document.getElementById("title").innerText = year + " Fitness Tracker";

/* ====== Helpers ====== */
function getTruePct(steps){ return Math.round((steps/8000)*100); }
function getFillPct(steps){ return Math.min(100,getTruePct(steps)); }

function getDayClass(key){
  var d=saved[key]||{};
  if(d[restItem]) return "gray";

  var steps=d.steps||0;
  var steps12000=steps>=12000;
  var steps8000=d[step8000];

  var gym=false;
  for(var i=0;i<gymItems.length;i++) if(d[gymItems[i]]) gym=true;

  if(steps12000 || (steps8000 && gym)) return "green";
  if(steps>0 || gym) return "yellow";
  return "";
}

/* ====== Modal ====== */
function openModal(key){
  var list=document.getElementById("checklist");
  list.innerHTML="";
  document.getElementById("modalDate").innerText=key;

  var steps=saved[key]?.steps||0;
  stepInput.value=steps||"";
  updateStepUI(steps);

  stepInput.oninput=function(){
    var v=parseInt(stepInput.value||0,10);
    saved[key]=saved[key]||{};
    saved[key].steps=v;
    saved[key][step8000]=v>=8000;
    saved[key][stepUnder]=v>0 && v<8000;
    saveAndRender();
  };

  for(var i=2;i<checklistItems.length;i++){
    var item=checklistItems[i];
    var l=document.createElement("label");
    var b=document.createElement("input");
    b.type="checkbox";
    b.checked=saved[key]?.[item];
    b.onchange=function(k,it){return function(e){
      saved[k]=saved[k]||{};
      saved[k][it]=e.target.checked;
      saveAndRender();
    }}(key,item);
    l.append(b,item);
    list.append(l);
  }

  modal.className="modal open";
}

function updateStepUI(steps){
  var pct=getTruePct(steps);
  stepBar.style.width=getFillPct(steps)+"%";
  stepPct.innerText=pct+"% of 8000 steps";
}

function closeModal(){ modal.className="modal"; }

/* ====== Bulk Import ====== */
function applyBulkSteps(){
  var t=bulkInput.value.trim();
  if(!t) return;
  t.split(/\n+/).forEach(function(line){
    var p=line.split(/[, ]+/);
    if(p.length<2) return;
    var k=p[0], s=parseInt(p[1],10);
    if(isNaN(s)) return;
    saved[k]=saved[k]||{};
    saved[k].steps=s;
    saved[k][step8000]=s>=8000;
    saved[k][stepUnder]=s>0 && s<8000;
  });
  bulkInput.value="";
  saveAndRender();
  closeModal();
}

/* ====== Render ====== */
function saveAndRender(){
  localStorage.setItem(storageKey,JSON.stringify(saved));
  render();
}

function render(){
  months.innerHTML="";
  for(var m=0;m<12;m++){
    var md=document.createElement("div");
    md.className="month";
    md.innerHTML="<h2>"+monthNames[m]+"</h2>";
    var g=document.createElement("div");
    g.className="grid";

    var d=new Date(year,m,1);
    while(d.getMonth()===m){
      var k=d.toISOString().slice(0,10);
      var s=saved[k]?.steps||0;
      var pct=s?getTruePct(s):"";
      var cls=getDayClass(k);

      var day=document.createElement("div");
      day.className="day "+cls+(k===todayKey?" today":"");
      day.style.setProperty("--fill",getFillPct(s)+"%");

      var badge=cls==="green"?"🔥":cls==="yellow"?"⚡":cls==="gray"?"🛌":"";
      day.innerHTML=d.getDate()+(badge?"<div>"+badge+"</div>":"")+(pct?"<div class='pct'>"+pct+"%</div>":"");

      day.onclick=function(k){return function(){openModal(k);}}(k);
      g.append(day);
      d.setDate(d.getDate()+1);
    }
    md.append(g);
    months.append(md);
  }
}

render();
</script>
</body>
</html>
