<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weight Tracker</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #022c22; /* deep green-teal */
  color: #ecfeff;
}

h1 {
  margin: 16px;
}

.month {
  margin-bottom: 24px;
}

h2 {
  margin: 8px 16px;
  font-size: 1rem;
  opacity: 0.7;
}

.grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  padding: 8px;
}

.day {
  background: #064e3b;
  text-align: center;
  padding: 10px 6px;
  border-radius: 8px;
  font-size: 0.8rem;
  cursor: pointer;
  border: 1px solid #064e3b;
}

.day.today {
  outline: 2px solid #34d399;
  outline-offset: -2px;
}

.day .weight {
  font-size: 0.65rem;
  opacity: 0.8;
  margin-top: 2px;
}

.day .trend {
  font-size: 0.75rem;
  margin-top: 2px;
}

.trend.up { color: #f87171; }
.trend.down { color: #34d399; }
.trend.same { color: #fde68a; }

/* modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal.open { display: flex; }

.sheet {
  background: #064e3b;
  width: 92%;
  max-width: 400px;
  border-radius: 16px;
  padding: 16px;
}

input[type="number"] {
  width: 100%;
  padding: 12px;
  font-size: 1rem;
  border-radius: 10px;
  border: none;
  margin-bottom: 12px;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 999px;
  background: #34d399;
  cursor: pointer;
}

.nav {
  text-align: center;
  padding: 24px;
  opacity: .7;
}

.nav a {
  color: #5eead4;
  text-decoration: none;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<div id="months"></div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="modalDate"></h3>
    <input
      type="number"
      id="weightInput"
      placeholder="Enter weight"
      step="0.1"
    />
    <button onclick="closeModal()">Done</button>
  </div>
</div>

<div class="nav">
  <a href="index.html">← Back to Fitness Checklist</a>
</div>

<script>
var year = new Date().getFullYear();
var todayKey = new Date().toISOString().slice(0,10);
var storageKey = "dailyWeight";

var saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
var monthsEl = document.getElementById("months");
var weightInput = document.getElementById("weightInput");

var monthNames = [
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

document.getElementById("title").innerText = year + " Weight Tracker";

function getPreviousWeight(dateKey) {
  var keys = Object.keys(saved).sort();
  for (var i = keys.length - 1; i >= 0; i--) {
    if (keys[i] < dateKey) return saved[keys[i]];
  }
  return null;
}

function getTrend(dateKey) {
  var current = saved[dateKey];
  var prev = getPreviousWeight(dateKey);
  if (prev === null || current === null) return "";
  if (current > prev) return "up";
  if (current < prev) return "down";
  return "same";
}

function openModal(dateKey) {
  document.getElementById("modalDate").innerText = dateKey;
  weightInput.value = saved[dateKey] || "";

  weightInput.oninput = function() {
    var val = parseFloat(weightInput.value);
    if (!isNaN(val)) saved[dateKey] = val;
    else delete saved[dateKey];
    localStorage.setItem(storageKey, JSON.stringify(saved));
    render();
  };

  document.getElementById("modal").className = "modal open";
}

function closeModal() {
  document.getElementById("modal").className = "modal";
}

function render() {
  monthsEl.innerHTML = "";

  for (var m = 0; m < 12; m++) {
    var monthDiv = document.createElement("div");
    monthDiv.className = "month";

    var header = document.createElement("h2");
    header.innerText = monthNames[m];
    monthDiv.appendChild(header);

    var grid = document.createElement("div");
    grid.className = "grid";

    var d = new Date(year, m, 1);
    while (d.getMonth() === m) {
      var key = d.toISOString().slice(0,10);
      var trend = getTrend(key);

      var day = document.createElement("div");
      day.className = "day";
      if (key === todayKey) day.className += " today";

      day.innerHTML =
        d.getDate() +
        (saved[key] ? '<div class="weight">' + saved[key] + '</div>' : '') +
        (trend ? '<div class="trend ' + trend + '">' +
          (trend === 'up' ? '▲' : trend === 'down' ? '▼' : '—') +
        '</div>' : '');

      day.onclick = (function(key){
        return function(){ openModal(key); };
      })(key);

      grid.appendChild(day);
      d.setDate(d.getDate() + 1);
    }

    monthDiv.appendChild(grid);
    monthsEl.appendChild(monthDiv);
  }
}

render();
</script>

</body>
</html>
